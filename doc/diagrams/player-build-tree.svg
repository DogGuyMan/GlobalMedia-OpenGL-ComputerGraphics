<text xml:space="preserve" text-anchor="start" x="11" y="-440.1" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="10.00">Warmup 순서 (BuildPlayer)</text>
<text xml:space="preserve" text-anchor="start" x="11" y="-422.6" font-family="Helvetica,sans-Serif" font-size="10.00">1. CreatePlayerActor(cfg) &#45; Life/Move/Weapon/Ctrl/BoxBody 부착</text>
<text xml:space="preserve" text-anchor="start" x="11" y="-406.35" font-family="Helvetica,sans-Serif" font-size="10.00">2. AddChild renderActor + aimPivot</text>
<text xml:space="preserve" text-anchor="start" x="11" y="-389.35" font-family="Helvetica,sans-Serif" font-size="10.00">3. AttachEntityPresentation &#45; director(sink)+death+체력바</text>
<text xml:space="preserve" text-anchor="start" x="11" y="-372.35" font-family="Helvetica,sans-Serif" font-size="10.00">4. BuildPlayerDirectionalGroups &#45; 8그룹 RegisterGroup</text>
<text xml:space="preserve" text-anchor="start" x="11" y="-355.35" font-family="Helvetica,sans-Serif" font-size="10.00">5. HpGrayscalePostFX 부착</text>
<text xml:space="preserve" text-anchor="start" x="11" y="-339.1" font-family="Helvetica,sans-Serif" font-size="10.00">6. RegisterPlayerCombatPlayables &#45; &quot;fire&quot;/&quot;dash&quot;/&quot;hit&quot;</text>
<text xml:space="preserve" text-anchor="start" x="11" y="-321.9" font-family="Helvetica,sans-Serif" font-size="10.00">7. 입력 콜백 &#45;&gt; director.Play / VFX seam 주입</text>
<text xml:space="preserve" text-anchor="start" x="11" y="-305.65" font-family="Helvetica,sans-Serif" font-size="10.00">8. AttachGroundDecals &#45; groundActor</text>
<text xml:space="preserve" text-anchor="start" x="11" y="-289.15" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="10.00">9. Root().AddChild &#45;&gt; OnEnter 발화 (Warmup tick)</text>
<text xml:space="preserve" text-anchor="start" x="11" y="-271.65" font-family="Helvetica,sans-Serif" font-size="10.00">10. PlayerHands 부착 &#45;&gt; Hand child 생성</text>
<text xml:space="preserve" text-anchor="start" x="11" y="-255.4" font-family="Helvetica,sans-Serif" font-size="10.00">11. camera follower SetFollowTarget</text>
<text xml:space="preserve" text-anchor="start" x="11" y="-238.4" font-family="Helvetica,sans-Serif" font-size="10.00">12. director.RefreshDirectional() &#45; 초기 가시성</text>
